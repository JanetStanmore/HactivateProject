version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:20
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Run linter
          command: npm run lint
      - run:
          name: Run tests
          command: npm test -- --coverage --watchAll=false
      - run:
          name: Build app
          command: npm run build
      - store_artifacts:
          path: coverage
      - store_artifacts:
          path: build

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build-and-test:
          filters:
            branches:
              only: main

# Invoke jobs via workflows
# See: https://circleci.com/docs/2.0/configuration-reference/#workflows
workflows:
  say-hello-workflow:
    jobs:
      - say-hello