version = 1

[[analyzers]]
name = "javascript"
  [analyzers.meta]
  plugins = ["react"]

[[analyzers]]
name = "typescript"
  [analyzers.meta]
  plugins = ["react"]

[[transformers]]
name = "prettier"
  [transformers.meta]
  config_files = ["prettier.config.js"]

[[transformers]]
name = "eslint"
  [transformers.meta]
  config_files = ["eslintrc.js", ".eslintrc.js", "eslintrc.json", ".eslintrc.json"]